name: Build and push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: Rebuild and republish even when this commit is already in ECR
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Queue rather than cancel. A cancelled run could publish the deployment
  # config without pushing the image, or the reverse, and the ordering of
  # those two steps is what makes the ECR trigger correct.
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the registry configuration is complete
        run: |
          set -eo pipefail
          missing=()
          for name in AWS_ECR_ROLE_ARN AWS_REGION ECR_REPOSITORY; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi
        env:
          AWS_ECR_ROLE_ARN: ${{ vars.AWS_ECR_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the test suite
        run: mvn -B test

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-publish-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -eo pipefail
          SHA="sha-${GITHUB_SHA::7}"

          # Two tags, deliberately. The task definition references the
          # immutable SHA tag, so a CodeDeploy rollback goes back to the image
          # that was actually running rather than to whatever "latest" has
          # since become. The mutable "latest" tag exists only as a stable
          # thing for the EventBridge rule to match on.
          echo "sha=$SHA"                                  >> "$GITHUB_OUTPUT"
          echo "uri=$REGISTRY/$REPOSITORY:$SHA"            >> "$GITHUB_OUTPUT"
          echo "latest=$REGISTRY/$REPOSITORY:latest"       >> "$GITHUB_OUTPUT"

          docker build \
            --build-arg "VERSION=$SHA" \
            --build-arg "COMMIT=$GITHUB_SHA" \
            --tag "$REGISTRY/$REPOSITORY:$SHA" \
            --tag "$REGISTRY/$REPOSITORY:latest" \
            .

      - name: Check the deployment configuration is complete
        id: deployable
        run: |
          set -eo pipefail
          # An empty ARTIFACT_BUCKET is the signal that the delivery stack does
          # not exist yet: the very first image has to reach ECR before the
          # platform can be created at all. Do not probe with head-bucket -
          # that needs s3:ListBucket, which this role is deliberately not
          # granted, so it would fail closed and skip the publish every run.
          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "ARTIFACT_BUCKET is unset - bootstrap run, publishing the image only"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          for name in TASK_FAMILY TASK_EXEC_ROLE_ARN TASK_ROLE_ARN LOG_GROUP \
                      DB_URL DB_SECRET_ARN REDIS_HOST REDIS_PORT REDIS_SECRET_ARN; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            echo "::error::Run scripts/sync-app-vars.sh in the infrastructure repository"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          TASK_FAMILY: ${{ vars.TASK_FAMILY }}
          TASK_EXEC_ROLE_ARN: ${{ vars.TASK_EXEC_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ vars.TASK_ROLE_ARN }}
          LOG_GROUP: ${{ vars.LOG_GROUP }}
          DB_URL: ${{ vars.DB_URL }}
          DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_SECRET_ARN: ${{ vars.REDIS_SECRET_ARN }}

      - name: Push the immutable image tag
        env:
          SHA_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -eo pipefail
          docker push "$SHA_IMAGE"

      - name: Resolve the immutable image digest
        id: digest
        if: steps.deployable.outputs.ready == 'true'
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -eo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a valid digest for $REPOSITORY:$SHA"
            exit 1
          fi
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish the deployment config
        if: steps.deployable.outputs.ready == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          TASK_FAMILY: ${{ vars.TASK_FAMILY }}
          TASK_EXEC_ROLE_ARN: ${{ vars.TASK_EXEC_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ vars.TASK_ROLE_ARN }}
          LOG_GROUP: ${{ vars.LOG_GROUP }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DB_URL: ${{ vars.DB_URL }}
          DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_SECRET_ARN: ${{ vars.REDIS_SECRET_ARN }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          set -eo pipefail
          mkdir -p build
          IMAGE_REPOSITORY="${IMAGE%%:*}"

          # jq rather than sed: DB_URL contains "&", which sed expands to the
          # whole match in a replacement, and DB_SECRET_ARN is substituted in
          # two places. jq also guarantees the result is still valid JSON.
          jq --arg family    "$TASK_FAMILY"        \
             --arg execRole  "$TASK_EXEC_ROLE_ARN" \
             --arg taskRole  "$TASK_ROLE_ARN"      \
             --arg image     "$IMAGE_REPOSITORY@sha256:${IMAGE_DIGEST#sha256:}" \
             --arg logGroup  "$LOG_GROUP"          \
             --arg region    "$AWS_REGION"         \
             --arg dbUrl     "$DB_URL"             \
             --arg dbSecret  "$DB_SECRET_ARN"      \
             --arg redisHost "$REDIS_HOST"         \
             --arg redisPort "$REDIS_PORT"         \
             --arg redisSecret "$REDIS_SECRET_ARN" \
             '
               .family                        = $family
             | .executionRoleArn              = $execRole
             | .taskRoleArn                   = $taskRole
             | .containerDefinitions[0].image = $image
             | .containerDefinitions[0].logConfiguration.options["awslogs-group"]  = $logGroup
             | .containerDefinitions[0].logConfiguration.options["awslogs-region"] = $region
             | .containerDefinitions[0].environment |= map(
                   if   .name == "SPRING_DATASOURCE_URL"  then .value = $dbUrl
                   elif .name == "SPRING_DATA_REDIS_HOST" then .value = $redisHost
                   elif .name == "SPRING_DATA_REDIS_PORT" then .value = $redisPort
                   else . end)
             | .containerDefinitions[0].secrets |= map(
                   if   .name | startswith("SPRING_DATASOURCE_")
                   then .valueFrom = $dbSecret + ":" + .valueFrom
                   elif .name == "SPRING_DATA_REDIS_PASSWORD"
                   then .valueFrom = $redisSecret + ":" + .valueFrom
                   else . end)
             ' taskdef.json > build/taskdef.json

          if jq -e '.. | strings | select(. == "")' build/taskdef.json >/dev/null; then
            echo "::error::taskdef.json still has empty fields after substitution"
            jq . build/taskdef.json
            exit 1
          fi

          cp appspec.yaml build/appspec.yaml
          (cd build && zip -q app.zip taskdef.json appspec.yaml)

          aws s3 cp build/app.zip "s3://${ARTIFACT_BUCKET}/config/app.zip"

      - name: Push the latest trigger tag
        env:
          SHA_IMAGE: ${{ steps.image.outputs.uri }}
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
        run: |
          set -eo pipefail
          # Order matters. The pipeline's S3 source does not poll; the only
          # trigger is the EventBridge rule watching for a push of the "latest"
          # tag. The task definition already names the resolved SHA digest by
          # the time this mutable trigger moves, so a later tag overwrite cannot
          # change the image used by this deployment or its rollback.
          docker push "$LATEST_IMAGE"

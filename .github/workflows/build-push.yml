name: Build and push to ECR

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Role ARNs are secrets rather than variables: they carry the account
      # ID, and GitHub redacts a secret from the workflow log.
      - name: Check the registry configuration is complete
        run: |
          set -eo pipefail
          missing=()
          for name in AWS_ECR_ROLE_ARN AWS_REGION ECR_REPOSITORY; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables or secrets: ${missing[*]}"
            exit 1
          fi
        env:
          AWS_ECR_ROLE_ARN: ${{ secrets.AWS_ECR_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the test suite
        run: mvn -B test

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-publish-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # "latest" is the only tag. Pushing it moves the tag to this image, the
      # previous image is left untagged, and the push event starts the
      # pipeline, which deploys this image by digest. The commit is baked in
      # as a build argument so the UI still reports which one is live.
      - name: Build the image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -eo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:latest"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

          docker build \
            --build-arg "VERSION=$GITHUB_SHA" \
            --build-arg "COMMIT=$GITHUB_SHA" \
            --tag "$IMAGE" \
            .

      - name: Push the latest tag
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -eo pipefail
          docker push "$IMAGE"

name: Build and push to ECR

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Role ARNs are secrets rather than variables: they carry the account
      # ID, and GitHub redacts a secret from the workflow log.
      - name: Check the registry configuration is complete
        run: |
          set -eo pipefail
          missing=()
          for name in AWS_ECR_ROLE_ARN AWS_REGION ECR_REPOSITORY; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables or secrets: ${missing[*]}"
            exit 1
          fi
        env:
          AWS_ECR_ROLE_ARN: ${{ secrets.AWS_ECR_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the test suite
        run: mvn -B test

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-publish-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check for an existing commit image
        id: existing
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -eo pipefail
          if aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -eo pipefail
          SHA="$GITHUB_SHA"

          echo "sha=$SHA"                                  >> "$GITHUB_OUTPUT"
          echo "uri=$REGISTRY/$REPOSITORY:$SHA"            >> "$GITHUB_OUTPUT"
          echo "latest=$REGISTRY/$REPOSITORY:latest"       >> "$GITHUB_OUTPUT"

          if [ "${{ steps.existing.outputs.exists }}" = true ]; then
            docker pull "$REGISTRY/$REPOSITORY:$SHA"
            docker tag "$REGISTRY/$REPOSITORY:$SHA" "$REGISTRY/$REPOSITORY:latest"
          else
            docker build \
              --build-arg "VERSION=$SHA" \
              --build-arg "COMMIT=$GITHUB_SHA" \
              --tag "$REGISTRY/$REPOSITORY:$SHA" \
              --tag "$REGISTRY/$REPOSITORY:latest" \
              .
          fi

      - name: Push the immutable image tag
        if: steps.existing.outputs.exists != 'true'
        env:
          SHA_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -eo pipefail
          docker push "$SHA_IMAGE"

      - name: Push the mutable latest tag
        env:
          LATEST_IMAGE: ${{ steps.image.outputs.latest }}
        run: |
          set -eo pipefail
          docker push "$LATEST_IMAGE"

server.port=${SERVER_PORT:8080}
spring.application.name=todo-ecs-app

# Each window has to be strictly larger than the one inside it: the ALB drains
# for 30s, then ECS sends SIGTERM and waits out stopTimeout=60s, inside which
# Boot has 20s to finish in-flight requests. That ordering is what makes the
# blue fleet terminate at the end of a shift without returning a single 502.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.version=${APP_VERSION:local}
app.commit=${APP_COMMIT:unknown}

# Every value below is supplied by the task definition in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:todoadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:todoadmin}

# RDS Proxy is the connection pool. Hikari only exists to avoid a TCP and TLS
# handshake per request, so it stays small - during a blue/green shift both
# fleets are alive at once and every one of their connections lands on the
# same proxy.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=300000
# Below the proxy's IdleClientTimeout of 1800s, so Hikari retires a connection
# before the proxy drops it underneath an in-flight request.
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=150000
# Start the pool empty rather than failing the context when the database is
# briefly unreachable. Without this a 20-second RDS blip during a green launch
# kills the container and fails the deployment.
spring.datasource.hikari.initialization-fail-timeout=-1

# Flyway owns the schema; Hibernate only checks that it matches the entities.
# Flyway takes an advisory lock, so tasks starting together cannot race.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

app.cache.enabled=${APP_CACHE_ENABLED:true}
app.cache.ttl-seconds=${APP_CACHE_TTL_SECONDS:30}

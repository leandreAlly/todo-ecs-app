<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e6e8ec; --ink: #1d2128;
    --muted: #7a8291; --accent: #2f6fde; --cache: #1f9d6b; --db: #c27a12; --warn: #d14343;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #181b21; --line: #2a2f38; --ink: #e7e9ee;
      --muted: #8a92a3; --accent: #6ea2ff; --cache: #48c78e; --db: #e0a33a; --warn: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 56px 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 20px; font-size: 24px; font-weight: 650; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  form.add { display: flex; border-bottom: 1px solid var(--line); }
  form.add input {
    flex: 1; padding: 14px 16px; border: 0; background: transparent; color: var(--ink); font: inherit;
  }
  form.add input:focus { outline: none; }
  form.add button {
    margin: 8px; padding: 0 14px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  li .title { flex: 1; overflow-wrap: anywhere; }
  li.done .title { color: var(--muted); text-decoration: line-through; }
  li .edit { flex: 1; font: inherit; color: var(--ink); background: transparent;
             border: 0; border-bottom: 1px solid var(--accent); padding: 0; }
  li .edit:focus { outline: none; }
  li .delete {
    border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1;
    cursor: pointer; opacity: 0; padding: 2px 4px;
  }
  li:hover .delete, li .delete:focus { opacity: 1; }
  li .delete:hover { color: var(--warn); }
  @media (hover: none) { li .delete { opacity: 1; } }
  .empty { padding: 20px 16px; color: var(--muted); text-align: center; }

  .status {
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    margin-top: 12px; padding: 0 4px; color: var(--muted); font-size: 13px;
  }
  .status .source::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: var(--muted); vertical-align: 1px;
  }
  .status .source.cache { color: var(--cache); }
  .status .source.cache::before { background: var(--cache); }
  .status .source.database { color: var(--db); }
  .status .source.database::before { background: var(--db); }
  .status .source.degraded { color: var(--warn); }
  .status .source.degraded::before { background: var(--warn); }
  .status .spacer { flex: 1; }
  .status button { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  .rollout { margin-top: 14px; padding: 0 4px; font-size: 13px; color: var(--muted); }
  .rollout .row { display: grid; grid-template-columns: 64px 1fr 34px; gap: 10px; align-items: center; margin-top: 6px; }
  .rollout .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .rollout .bar span { display: block; height: 100%; background: var(--accent); }
  .rollout .pct { text-align: right; }
</style>
</head>
<body>
<div class="wrap">
  <h1>To-Do Lab Review</h1>

  <div class="card">
    <form class="add" id="add-form" autocomplete="off">
      <input type="text" id="new-title" maxlength="200" placeholder="Add a task" aria-label="New task" required>
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
    <div class="empty" id="empty" hidden>No tasks yet.</div>
  </div>

  <div class="status">
    <span class="source" id="source">loading</span>
    <span id="latency"></span>
    <span id="count"></span>
    <span class="spacer"></span>
    <code id="version" title="Commit serving this page"></code>
    <button id="refresh" type="button">Refresh</button>
  </div>

  <!-- Only shown while more than one commit answers, i.e. during a blue/green
       traffic shift. Each poll can land on either target group. -->
  <div class="rollout" id="rollout" hidden>
    Rolling out &mdash; last <span id="sample-size">0</span> requests
    <div id="histogram"></div>
  </div>
</div>

<script>
(function () {
  const list = document.getElementById('task-list');
  const empty = document.getElementById('empty');
  const source = document.getElementById('source');

  const KNOWN_SOURCES = ['cache', 'database'];
  const json = { 'Content-Type': 'application/json' };

  function escapeHtml(value) {
    return value.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function renderStatus(page) {
    source.className = 'source ' + (KNOWN_SOURCES.includes(page.source) ? page.source : 'degraded');
    source.textContent = 'from ' + page.source;
    document.getElementById('latency').textContent = page.latencyMs + ' ms';
    const done = page.items.filter(t => t.completed).length;
    document.getElementById('count').textContent =
      page.items.length === 0 ? '' : done + ' of ' + page.items.length + ' done';
  }

  function renderTasks(items) {
    list.innerHTML = '';
    empty.hidden = items.length > 0;
    for (const task of items) {
      const li = document.createElement('li');
      if (task.completed) li.className = 'done';
      li.innerHTML =
        '<input type="checkbox" aria-label="Done" ' + (task.completed ? 'checked' : '') + '>' +
        '<span class="title" title="Double-click to edit">' + escapeHtml(task.title) + '</span>' +
        '<button class="delete" type="button" aria-label="Delete">&times;</button>';
      li.querySelector('input').addEventListener('change', () =>
        update(task, { completed: !task.completed }));
      li.querySelector('.delete').addEventListener('click', () => remove(task));
      li.querySelector('.title').addEventListener('dblclick', e => startEdit(task, e.target));
      list.appendChild(li);
    }
  }

  function startEdit(task, span) {
    const input = document.createElement('input');
    input.className = 'edit';
    input.maxLength = 200;
    input.value = task.title;
    span.replaceWith(input);
    input.focus();
    input.select();
    let finished = false;
    const finish = save => {
      if (finished) return;
      finished = true;
      const title = input.value.trim();
      if (save && title && title !== task.title) update(task, { title });
      else load();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  async function load() {
    try {
      const page = await (await fetch('/api/tasks')).json();
      renderStatus(page);
      renderTasks(page.items);
    } catch (e) {
      source.className = 'source degraded';
      source.textContent = 'unreachable';
    }
  }

  async function update(task, changes) {
    await fetch('/api/tasks/' + task.id, { method: 'PATCH', headers: json, body: JSON.stringify(changes) });
    load();
  }

  async function remove(task) {
    await fetch('/api/tasks/' + task.id, { method: 'DELETE' });
    load();
  }

  document.getElementById('add-form').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('new-title');
    const title = input.value.trim();
    if (!title) return;
    await fetch('/api/tasks', { method: 'POST', headers: json, body: JSON.stringify({ title }) });
    input.value = '';
    load();
  });

  document.getElementById('refresh').addEventListener('click', load);

  // Version polling. During a canary shift polls land on both target groups,
  // so the tally shows the traffic split; otherwise only the commit is shown.
  const samples = [];
  const rollout = document.getElementById('rollout');
  const histogram = document.getElementById('histogram');

  function renderRollout() {
    const counts = new Map();
    for (const commit of samples) counts.set(commit, (counts.get(commit) || 0) + 1);
    rollout.hidden = counts.size < 2;
    if (rollout.hidden) return;
    document.getElementById('sample-size').textContent = samples.length;
    histogram.innerHTML = '';
    for (const [commit, count] of [...counts.entries()].sort((a, b) => b[1] - a[1])) {
      const pct = Math.round(count / samples.length * 100);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<code>' + escapeHtml(commit) + '</code>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<span class="pct">' + pct + '%</span>';
      histogram.appendChild(row);
    }
  }

  async function pollVersion() {
    try {
      const info = await (await fetch('/api/version')).json();
      const short = (info.commit || 'unknown').substring(0, 7);
      document.getElementById('version').textContent = short;
      samples.push(short);
      if (samples.length > 20) samples.shift();
      renderRollout();
    } catch (e) { /* a shift in progress can drop a poll; ignore it */ }
  }

  load();
  pollVersion();
  setInterval(pollVersion, 3000);
})();
</script>
</body>
</html>
